aid: cority

name: Cority

description: Cority is an enterprise Environmental, Health, Safety, and Quality (EHSQ) and sustainability software provider, founded in 1985 as
  Medgate and headquartered in Toronto, Canada. Its CorityOne platform converges occupational health, safety and incident management, industrial
  hygiene, environmental and ESG/sustainability reporting, quality, and audit/compliance management for more than 1,500 enterprise organizations
  worldwide, layered with its Cortex AI agents. Cority exposes RESTful integration through the Cority Enviance API (Swagger-documented), used
  to connect CorityOne with corporate and third-party systems under a Connectors license.

